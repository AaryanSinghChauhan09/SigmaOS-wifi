name: Validate component contract

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  metadata:
    name: Metadata & Contract Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate component metadata and README
        run: |
          python - <<'PY'
          import tomllib
          from pathlib import Path

          required = {
              "name",
              "schema_version",
              "responsibility",
              "integration_repository",
              "canonical_branch",
              "status",
              "license",
          }
          metadata = tomllib.loads(Path("COMPONENT.toml").read_text())
          missing = sorted(required - metadata.keys())
          if missing:
              raise SystemExit(f"COMPONENT.toml is missing: {', '.join(missing)}")
          if metadata["canonical_branch"] != "main":
              raise SystemExit("canonical_branch must be main")
          if metadata["status"] not in {"scaffold", "prototype", "implemented", "verified", "released"}:
              raise SystemExit(f"unsupported component status: {metadata['status']}")
          if not Path("README.md").is_file():
              raise SystemExit("README.md is required")
          print(f"validated {metadata['name']} ({metadata['status']})")
          PY

  build-test:
    name: Build & Test
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings
      - name: Build release
        run: cargo build --release
      - name: Run tests
        run: cargo test --all
